services:
  workspace:
    image: ${WORKSPACE_RUNTIME_IMAGE:-ghcr.io/bourgils/remote-workspace:latest}
    restart: unless-stopped
    init: true
    environment:
      WORKSPACE_NAME: ${WORKSPACE_NAME:-obsidian}
      WORKSPACE_PATH: /workspace
      TZ: ${TZ:-Europe/Paris}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD}
      SHELL_USERNAME: ${SHELL_USERNAME:-workspace}
      SHELL_PASSWORD: ${SHELL_PASSWORD:?Set SHELL_PASSWORD}
      OPENCODE_PUBLIC_URL: ${OPENCODE_PUBLIC_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - machine-state:/state
      - workspace-data:/workspace
    expose:
      - "4096"
      - "7681"
    healthcheck:
      test: ["CMD", "/usr/local/bin/workspace-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  obsidian:
    image: ${OBSIDIAN_IMAGE:-lscr.io/linuxserver/obsidian:latest}
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: ${TZ:-Europe/Paris}
      CUSTOM_USER: ${OBSIDIAN_USERNAME:?Set OBSIDIAN_USERNAME}
      PASSWORD: ${OBSIDIAN_PASSWORD:?Set OBSIDIAN_PASSWORD}
    volumes:
      - obsidian-config:/config
      - workspace-data:/workspace
    expose:
      - "3000"
    shm_size: "1gb"

volumes:
  machine-state:
  workspace-data:
  obsidian-config:
