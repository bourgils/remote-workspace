services:
  workspace:
    image: ${WORKSPACE_RUNTIME_IMAGE:-ghcr.io/bourgils/remote-workspace:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      WORKSPACE_NAME: ${WORKSPACE_NAME:-obsidian}
      WORKSPACE_PATH: /workspace
      TZ: ${TZ:-Europe/Paris}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD}
      SHELL_USERNAME: ${SHELL_USERNAME:-workspace}
      SHELL_PASSWORD: ${SHELL_PASSWORD:?Set SHELL_PASSWORD}
      OPENCODE_PUBLIC_URL: ${OPENCODE_PUBLIC_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - machine-state:/state
      - workspace-data:/workspace
    expose:
      - "4096"
      - "7681"
    healthcheck:
      test: ["CMD", "/usr/local/bin/workspace-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  obsidian:
    image: ${IGNIS_IMAGE:-nobbe/ignis:latest}
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
    volumes:
      - workspace-data:/vaults
      - ignis-data:/app/data
      - obsidian-app:/app/obsidian-app
    expose:
      - "8080"
    labels:
      - "traefik.http.middlewares.remote-workspace-obsidian-auth.basicauth.users=${OBSIDIAN_USERNAME}:${OBSIDIAN_PASSWORD_HASH}"
      - "coolify.traefik.middlewares=remote-workspace-obsidian-auth"

volumes:
  machine-state:
  workspace-data:
  ignis-data:
  obsidian-app:
