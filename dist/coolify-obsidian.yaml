services:
  docker-proxy:
    image: ghcr.io/bourgils/docker-proxy:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      BIND_CONFIG: 0.0.0.0:2375
      DELETE: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wake-control

  workspace:
    image: ghcr.io/bourgils/wakewrap:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      WAKE_IMAGE: ${WORKSPACE_RUNTIME_IMAGE:-ghcr.io/bourgils/remote-workspace:latest}
      WAKE_PULL: always
      WAKE_PORTS: 4096,7681
      WAKE_CONTROL_NETWORKS: wake-control
      WORKSPACE_NAME: ${WORKSPACE_NAME:-obsidian}
      WORKSPACE_BOOTSTRAP_DIRS: vaults
      TZ: ${TZ:-Europe/Paris}
      OPENCODE_AUTH_ENABLED: "${OPENCODE_AUTH_ENABLED:-true}"
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:-}"
      SHELL_AUTH_ENABLED: "${SHELL_AUTH_ENABLED:-true}"
      SHELL_USERNAME: ${SHELL_USERNAME:-workspace}
      SHELL_PASSWORD: "${SHELL_PASSWORD:-}"
      OPENCODE_PUBLIC_URL: ${OPENCODE_PUBLIC_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - machine-state:/state
      - workspace-data:/mnt/workspace
    expose:
      - "4096"
      - "7681"
    networks:
      - default
      - wake-control
    depends_on:
      docker-proxy:
        condition: service_healthy

  obsidian:
    image: ghcr.io/bourgils/wakewrap:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      WAKE_IMAGE: ${IGNIS_IMAGE:-nobbe/ignis:latest}
      WAKE_PULL: missing
      WAKE_PORTS: "8080"
      WAKE_CONTROL_NETWORKS: wake-control
      VAULT_ROOT: /workspace/vaults
      PUID: "0"
      PGID: "0"
    volumes:
      - workspace-data:/workspace
      - ignis-data:/app/data
      - obsidian-app:/app/obsidian-app
    expose:
      - "8080"
    labels:
      - "traefik.http.middlewares.remote-workspace-obsidian-auth.basicauth.users=${OBSIDIAN_USERNAME}:${OBSIDIAN_PASSWORD_HASH}"
      - "coolify.traefik.middlewares=remote-workspace-obsidian-auth"
    networks:
      - default
      - wake-control
    depends_on:
      docker-proxy:
        condition: service_healthy

volumes:
  machine-state:
  workspace-data:
  ignis-data:
  obsidian-app:

networks:
  wake-control:
    internal: true
