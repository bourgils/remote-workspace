services:
  workspace:
    build:
      context: ..
    restart: unless-stopped
    init: true
    environment:
      WORKSPACE_NAME: ${WORKSPACE_NAME:?Set WORKSPACE_NAME}
      TZ: ${TZ:-Europe/Paris}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD}
      OPENCODE_PUBLIC_URL: ${OPENCODE_PUBLIC_URL:-}
      SHELL_USERNAME: ${SHELL_USERNAME:-workspace}
      SHELL_PASSWORD: ${SHELL_PASSWORD:?Set SHELL_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - machine-state:/state
      - workspace-data:/mnt/workspace
    expose:
      - "4096"
      - "7681"
    healthcheck:
      test: ["CMD", "/usr/local/bin/workspace-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  machine-state:
  workspace-data:
