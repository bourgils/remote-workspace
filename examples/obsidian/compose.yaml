# Example only: add your preferred Obsidian web/desktop container and point it at
# the exact same workspace-data volume. The core runtime has no Obsidian dependency.
services:
  workspace:
    environment:
      WORKSPACE_BOOTSTRAP_DIRS: vaults
    volumes:
      - machine-state:/state
      - workspace-data:/mnt/workspace

  obsidian:
    image: ${OBSIDIAN_IMAGE:?Set OBSIDIAN_IMAGE}
    restart: unless-stopped
    environment:
      VAULT_ROOT: /workspace/vaults
    volumes:
      - workspace-data:/workspace

volumes:
  machine-state:
  workspace-data:
